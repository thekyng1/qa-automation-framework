name: AI Real Eval (DeepSeek)

on:
  workflow_dispatch:

jobs:
  ai-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run AI eval tests against real DeepSeek API
        run: npx playwright test tests/ai --workers=1
        env:
          AI_EVAL_MODE: 'real'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-real-results
          path: |
            playwright-report/
            playwright-report.json
            test-results/
          retention-days: 14
